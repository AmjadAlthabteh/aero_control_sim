name: ci

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Configure
        run: cmake -S . -B build-ci -DAERO_CONTROL_SIM_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-ci --config Release
      - name: Test
        run: ctest --test-dir build-ci -C Release --output-on-failure

